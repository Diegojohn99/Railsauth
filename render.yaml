services:
  - type: web
    name: auth-app
    env: ruby
    plan: free
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RENDER_FREE_MODE
        value: "true"
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "2"
      - key: APP_HOST
        sync: false
      - key: SMTP_PROVIDER
        value: brevo
      - key: SMTP_ADDRESS
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_DOMAIN
        value: smtp-brevo.com
      - key: SMTP_AUTH
        value: login
      - key: SMTP_TLS
        value: "false"
      - key: SMTP_OPEN_TIMEOUT
        value: "30"
      - key: SMTP_READ_TIMEOUT
        value: "30"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        sync: false
